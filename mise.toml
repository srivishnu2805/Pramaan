[tools]
deno = "2.9.6"

[env]
PYTHONPATH = "src"

[tasks]
dev = "uv run uvicorn pramaan.main:app --app-dir src --reload --port 8000"
web = "deno task --cwd web dev"
worker = "uv run python worker.py"
seed = "uv run python scripts/seed.py"
test = "uv run pytest"
lint = "uv run ruff check . && cd web && deno lint"
format = "uv run ruff format . && deno fmt --cwd web"
check = "uv run ruff check . && uv run pytest"
db-upgrade = "uv run alembic upgrade head"
db-revision = "uv run alembic revision --autogenerate -m"
db-up = "docker compose up -d"
db-down = "docker compose down"
db-logs = "docker compose logs -f db"
db-reset = "docker compose down -v && docker compose up -d && uv run alembic upgrade head"
docker-build = "docker compose build"
docker-up = "docker compose up -d"
docker-down = "docker compose down"
docker-logs = "docker compose logs -f"
