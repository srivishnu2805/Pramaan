version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pramaan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pramaan_admin
      POSTGRES_PASSWORD: secure
      POSTGRES_DB: pramaan_db
    ports:
      - "${PRAMAAN_DB_PORT:-5432}:5432"
    volumes:
      - pramaan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan_admin -d pramaan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pramaan_backend
    restart: unless-stopped
    environment:
      - PRAMAAN_DATABASE_URL=postgresql+asyncpg://pramaan_admin:secure@db:5432/pramaan_db
      - PRAMAAN_JWT_SECRET=${PRAMAAN_JWT_SECRET}
      - PRAMAAN_KMS_ROOT_KEY_HEX=${PRAMAAN_KMS_ROOT_KEY_HEX}
      - PRAMAAN_ALLOW_EXTERNAL_AI=${PRAMAAN_ALLOW_EXTERNAL_AI:-false}
      - PRAMAAN_OPENAI_API_KEY=${PRAMAAN_OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pramaan_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pramaan_worker
    restart: unless-stopped
    environment:
      - PRAMAAN_DATABASE_URL=postgresql+asyncpg://pramaan_admin:secure@db:5432/pramaan_db
      - PRAMAAN_KMS_ROOT_KEY_HEX=${PRAMAAN_KMS_ROOT_KEY_HEX}
      - PRAMAAN_ALLOW_EXTERNAL_AI=${PRAMAAN_ALLOW_EXTERNAL_AI:-false}
      - PRAMAAN_OPENAI_API_KEY=${PRAMAAN_OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pramaan_pgdata: