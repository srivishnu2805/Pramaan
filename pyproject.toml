[project]
name = "pramaan"
version = "0.1.0"
description = "Secure, tamper-evident, AI-assisted digital document management system (SIH)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "cryptography>=43",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2",
    "PyMuPDF>=1.24",
    "python-magic>=0.4.27",
    "structlog>=24.4",
    "openai>=1.51",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "anyio>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["web", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
system-certs = true
